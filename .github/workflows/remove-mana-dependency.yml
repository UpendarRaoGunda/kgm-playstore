name: Remove external KGM dependency

on:
  push:
    paths:
      - '.github/workflows/remove-mana-dependency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove cross-project URL from KGM source
        shell: bash
        run: |
          set -euo pipefail
          target="https://mana-"'koratlagudem.onrender.com'
          mapfile -t files < <(grep -RIl --exclude-dir=.git --exclude='remove-mana-dependency.yml' "$target" . || true)
          for file in "${files[@]}"; do
            python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text(); p.write_text(t.replace(sys.argv[2], ""))' "$file" "$target"
          done
          if grep -RIn --exclude-dir=.git --exclude='remove-mana-dependency.yml' "$target" .; then
            echo 'Cross-project URL still present' >&2
            exit 1
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No remaining references.'
            exit 0
          fi
          git config user.name 'KGM cleanup bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Remove cross-project URL from KGM frontend'
          git push origin HEAD:main
